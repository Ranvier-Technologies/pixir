name: Frontend and verification checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Test verification CLI behavior
        run: uv run python -m unittest discover -s test -p verify_cli_test.py

  frontend:
    name: Frontend (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: site
            directory: site
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Detect source-only surface
        id: surface
        env:
          APP_DIRECTORY: ${{ matrix.directory }}
        run: |
          if test -f "$APP_DIRECTORY/package.json"; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "$APP_DIRECTORY is absent from this checkout; not applicable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.surface.outputs.present == 'true'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.surface.outputs.present == 'true'
        with:
          version: '11.5.0'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        if: steps.surface.outputs.present == 'true'
      - name: Install locked frontend dependencies
        if: steps.surface.outputs.present == 'true'
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile
      - name: Verify this application
        if: steps.surface.outputs.present == 'true'
        env:
          VERIFY_SCOPE: ${{ matrix.scope }}
        run: uv run python bin/verify --scope "$VERIFY_SCOPE" --json --show-failures --output-dir "/tmp/pixir-verify-$VERIFY_SCOPE"
      - name: Keep verification evidence
        if: always() && steps.surface.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.scope }}
          path: /tmp/pixir-verify-${{ matrix.scope }}
          if-no-files-found: warn
          retention-days: 7
